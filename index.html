<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body class="bg-gray-100 p-6">
    <h1 class="text-2xl font-bold mb-4">Inscription aux cours</h1>
    <input id="recherche" type="text" placeholder="Rechercher..." oninput="afficher()" class="border p-2 rounded">

    <select id="categorie" onchange="afficher()" class="border p-2 rounded">
        <option value="">Toutes</option>
        <option value="Web">Web</option>
        <option value="Data">Data</option>
        <option value="Design">Design</option>
    </select>
    <div class="flex gap-4">
        <div id="liste" class="w-full grid grid-cols-3 gap-4 mt-6"></div>

        <div id="panier" class="w-[35%] bg-white rounded-lg shadow-md p-4 mt-6 h-fit">
            <h2 class="text-xl font-bold mb-4">Mon panier</h2>

            <div id="panier-items" class="flex flex-col items-center gap-3">
                <p id="panier-empty" class="hidden text-gray-500">Votre panier est vide.</p>
                
            </div>

            <div class="border-t mt-4 pt-4 flex justify-between font-bold">
                <span>Total :</span>
                <span id="panier-total">0 DH</span>
            </div>
        </div>
    </div>
    <script>
        const panierItems = document.getElementById("panier-items");
        const panierTotal = document.getElementById("panier-total");

        let cours = [
            { id: 1, titre: "HTML & CSS", categorie: "Web", duree: "20h", prix: 300 },
            { id: 2, titre: "<i>JavaScript</i>", categorie: "Web", duree: "30h", prix: 450 },
            { id: 3, titre: "Python", categorie: "Data", duree: "25h", prix: 400 },
            { id: 4, titre: "SQL", categorie: "Data", duree: "15h", prix: 250 },
            { id: 5, titre: "Figma", categorie: "Design", duree: "10h", prix: 200 },
            { id: 6, titre: "UI/UX", categorie: "Design", duree: "18h", prix: 350 }
        ];

        let totalPrix = 0;

        let panierObj = {};
        
        function afficher() {
            let texte = document.getElementById("recherche").value.toLowerCase();
            let categorie = document.getElementById("categorie").value;
            let liste = document.getElementById("liste");

            liste.innerHTML = "";

            for (let i = 0; i < cours.length; i++) {
                let c = cours[i];
                // Filtre 1 : le texte
                if (!c.titre.toLowerCase().includes(texte)) continue;
                // Filtre 2 : la catégorie
                if (categorie != "" && c.categorie != categorie) continue;

                liste.innerHTML += `<div class="bg-white p-4 rounded shadow">
                    <h2 class="font-bold">${c.titre}</h2>
                    <p>${c.categorie}</p>
                    <p>${c.duree}</p>
                    <p class="text-blue-600 font-bold">${c.prix} DH</p>
                    <button id="btn-item-${c.id}" value="${c.id}" class="bg-blue-600 text-white px-4 py-2 rounded mt-2"> S'inscrire </button>
                </div>`;
            }

            for (let i = 1; i <= cours.length; i++) {
                let btn = document.getElementById(`btn-item-${i}`);
                btn.addEventListener("click", ()=> {
                    let id = btn.value;
                    if (panierObj[id]) return;
                    let cour = cours[id-1];
                    totalPrix += cour.prix;
                    panierItems.innerHTML += `
                    <div id="item" class="w-full flex justify-between items-center h-9">
                        <h1>${cour.titre}</h1>
                        <h3>${cour.prix} MAD</h3>
                    </div>
                    `;
                    panierTotal.innerText = totalPrix + " DH";
                    panierObj[id] = true;
                })
            }
            
        }

        function inscrire(titre) {
            alert("Vous êtes inscrit au cours : " + titre);
        }

        afficher();
    </script>
</body>

</html>
